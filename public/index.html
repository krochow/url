<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EdgeShort — Custom URL Shortener</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <div class="mx-auto max-w-4xl px-4 py-10 sm:px-6 lg:px-8">
      <!-- Header -->
      <header class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800/80 pb-6">
        <div class="flex items-center gap-3">
          <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 font-bold text-white shadow-lg shadow-indigo-600/25">
            ES
          </div>
          <div>
            <h1 class="text-xl font-semibold tracking-tight text-white">EdgeShort</h1>
            <p class="text-xs text-slate-400">Powered by Cloudflare Pages, Hono &amp; D1</p>
          </div>
        </div>
        <!-- Auth Controls -->
        <div id="auth-controls" class="flex items-center gap-3">
          <a
            id="login-btn"
            href="/api/auth/google"
            class="inline-flex items-center gap-2 rounded-lg border border-slate-700 bg-slate-900 px-3.5 py-2 text-xs font-medium text-slate-200 transition hover:bg-slate-800"
          >
            Sign in with Google
          </a>
        </div>
      </header>

      <!-- Shorten Form -->
      <section class="mt-8 rounded-2xl border border-slate-800 bg-slate-900/70 p-6 shadow-xl">
        <h2 class="text-base font-semibold text-white">Create a short link</h2>
        <form id="shorten-form" class="mt-4 space-y-4">
          <div>
            <label for="target-url" class="block text-xs font-medium uppercase tracking-wider text-slate-400">
              Destination URL *
            </label>
            <input
              id="target-url"
              name="target_url"
              type="url"
              required
              placeholder="https://example.com/very/long/url"
              class="mt-1.5 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30"
            />
          </div>

          <div class="grid gap-4 sm:grid-cols-2">
            <div>
              <label for="custom-slug" class="block text-xs font-medium uppercase tracking-wider text-slate-400">
                Custom Slug (Optional)
              </label>
              <input
                id="custom-slug"
                name="slug"
                type="text"
                pattern="[a-zA-Z0-9_-]{3,32}"
                placeholder="my-link"
                class="mt-1.5 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30"
              />
            </div>

            <div>
              <label for="link-title" class="block text-xs font-medium uppercase tracking-wider text-slate-400">
                Title (Optional)
              </label>
              <input
                id="link-title"
                name="title"
                type="text"
                maxlength="100"
                placeholder="Landing page"
                class="mt-1.5 w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30"
              />
            </div>
          </div>

          <div id="form-feedback" class="hidden rounded-xl px-4 py-3 text-sm"></div>

          <div class="flex justify-end">
            <button
              id="submit-btn"
              type="submit"
              class="inline-flex items-center justify-center rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-medium text-white shadow-lg shadow-indigo-600/20 transition hover:bg-indigo-500 disabled:opacity-50"
            >
              Shorten URL
            </button>
          </div>
        </form>
      </section>

      <!-- Links List -->
      <section class="mt-8">
        <div class="flex items-center justify-between">
          <h2 class="text-base font-semibold text-white">Recent Links</h2>
          <button
            id="refresh-btn"
            type="button"
            class="text-xs font-medium text-indigo-400 hover:text-indigo-300"
          >
            Refresh
          </button>
        </div>

        <div id="links-container" class="mt-4 space-y-3">
          <div class="rounded-2xl border border-slate-800 bg-slate-900/40 p-6 text-center text-sm text-slate-400">
            Loading links...
          </div>
        </div>
      </section>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
